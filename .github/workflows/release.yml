name: release
# Manual run only: Actions > release > Run workflow. Builds a SIGNED AAB (for Google Play) and a signed APK.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (integer; must be higher than the last Play upload)'
        required: true
        default: '1'
      version_name:
        description: 'versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing GitHub secret: $v (see docs/RELEASE.md)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Build signed AAB + APK
        env:
          VC: ${{ inputs.version_code }}
          VN: ${{ inputs.version_name }}
        run: gradle :app:bundleRelease :app:assembleRelease -PappVersionCode="$VC" -PappVersionName="$VN" --stacktrace
      - name: Show signing fingerprints (compare with docs/PERMISSIONS.md)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          keytool -printcert -jarfile "$APK" | grep -E "SHA1|SHA256" || true
      - name: Remove secrets from runner
        if: always()
        run: rm -f release.jks keystore.properties
      - uses: actions/upload-artifact@v4
        with:
          name: filemind-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
